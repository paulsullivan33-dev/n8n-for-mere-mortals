site_name: n8n for Mere Mortals
site_description: A workflow automation tool you run on your own machine. Connecting services, webhooks and schedules into automations you draw instead of glue code you write, running them while you are elsewhere, and opening every execution afterwards to see exactly what happened, with the limits stated plainly.
